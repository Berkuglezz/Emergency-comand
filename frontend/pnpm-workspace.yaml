packages: []

# Solo esbuild necesita ejecutar su script de instalación (binario nativo).
allowBuilds:
  esbuild: true

minimumReleaseAgeExclude:
  - "@shadcn/registry@0.1.3"
  - shadcn@4.21.4

peerDependencyRules:
  allowedVersions:
    # openapi-typescript declara typescript ^5, pero funciona con TypeScript 6
    # (verificado). TypeScript 7 no es compatible con typescript-eslint.
    openapi-typescript>typescript: "6"
